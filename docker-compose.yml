version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alllove_user
      POSTGRES_PASSWORD: alllove_password
      POSTGRES_DB: alllove_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  https:
    image: nginx:alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/ssl/alllove:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  postgres_data:
