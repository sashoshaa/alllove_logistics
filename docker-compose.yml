services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alllove_user
      POSTGRES_PASSWORD: alllove_password
      POSTGRES_DB: alllove_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alllove_user -d alllove_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pip_cache:/root/.cache/pip
    environment:
      DATABASE_URL: postgresql+asyncpg://alllove_user:alllove_password@db:5432/alllove_db
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
    ports:
      - "8000:8000"
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install -r requirements.txt &&
             alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  https:
    image: nginx:alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/ssl/alllove:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  postgres_data:
  pip_cache:
  frontend_node_modules:
